name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  # Write Gradle caches on main + tags; PRs only restore (faster + less cache thrash)
  GRADLE_CACHE_READ_ONLY: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          # Do NOT set cache: gradle here — gradle/actions/setup-gradle owns Gradle User Home

      - name: Set up Gradle (cache write on main/tags)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ env.GRADLE_CACHE_READ_ONLY }}
          cache-cleanup: on-success
          # caches = deps + build-cache; wrapper = Gradle distribution
          gradle-home-cache-includes: |
            caches
            notifications
            wrapper

      - name: Unit tests + warm dependency cache
        run: |
          chmod +x gradlew
          # Resolve/print deps so Linux PE packaging reuses the same User Home cache
          ./gradlew --no-daemon \
            :shared:allTests \
            :desktop:test \
            :desktop:dependencies \
            --stacktrace

  windows:
    name: Package Windows (PE)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # Same OS as test — restore only to avoid overwriting the warmed Linux cache entry
      - name: Set up Gradle (cache read-only)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
          cache-cleanup: never

      - name: Install MinGW (cross PE linker)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mingw-w64 binutils-mingw-w64-x86-64 g++-mingw-w64-x86-64

      - name: Build single-file Windows exe
        run: |
          chmod +x gradlew scripts-kmp/*.sh
          ./scripts-kmp/package-windows.sh

      - name: Upload Windows PE
        uses: actions/upload-artifact@v4
        with:
          name: windows-pe
          path: |
            dist-kmp-windows/cache-fix-gui-kmp.exe
            dist-kmp-windows/README.txt
          if-no-files-found: error
          retention-days: 30

  # Separate DMGs per CPU: Intel (x64) on macos-13, Apple Silicon (arm64) on macos-14.
  macos:
    name: Package macOS (${{ matrix.arch }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13
            arch: x64
          - os: macos-14
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Host architecture
        run: |
          echo "matrix.arch=${{ matrix.arch }}"
          uname -m
          java -version || true

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # Per-OS/arch cache (setup-gradle keys include runner OS)
      - name: Set up Gradle (cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ env.GRADLE_CACHE_READ_ONLY }}
          cache-cleanup: on-success

      - name: Generate macOS .icns
        run: |
          chmod +x scripts-kmp/make-macos-icns.sh
          ./scripts-kmp/make-macos-icns.sh

      - name: Package DMG + fat jar
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon \
            :desktop:packageReleaseDmg \
            :desktop:fatJar \
            --stacktrace

      - name: Collect macOS artifacts
        env:
          ARCH: ${{ matrix.arch }}
          RUNNER_OS_LABEL: ${{ matrix.os }}
        run: |
          set -euo pipefail
          mkdir -p dist-macos
          # Use find (not bash **): Compose writes main-release/dmg/*.dmg (2+ path levels)
          # Avoid mapfile — macOS runners may ship Bash 3.2
          n=0
          while IFS= read -r f; do
            [[ -z "$f" ]] && continue
            echo "Found DMG: $f"
            base="$(basename "$f" .dmg)"
            dest="dist-macos/${base}-${ARCH}.dmg"
            cp -v "$f" "$dest"
            n=$((n + 1))
          done < <(find desktop/build/compose/binaries -type f -name '*.dmg' 2>/dev/null | sort)
          if [[ "$n" -eq 0 ]]; then
            echo "ERROR: no DMG produced for arch=${ARCH}" >&2
            find desktop/build/compose/binaries -type f 2>/dev/null | head -100 || true
            exit 1
          fi
          if [[ -f desktop/build/libs/cache-fix-gui-kmp-all.jar ]]; then
            cp -v desktop/build/libs/cache-fix-gui-kmp-all.jar \
              "dist-macos/cache-fix-gui-kmp-${ARCH}-all.jar"
          fi
          {
            echo "cache-fix-gui macOS (${ARCH})"
            echo "=============================="
            echo "Runner: ${RUNNER_OS_LABEL}"
            echo "Host uname: $(uname -m)"
            echo ""
            echo "Install the matching DMG for your Mac:"
            echo "  - x64   → Intel Mac"
            echo "  - arm64 → Apple Silicon (M1/M2/M3/M4…)"
            echo ""
            echo "Built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "dist-macos/README-${ARCH}.txt"
          ls -la dist-macos

      - name: Upload macOS package (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-${{ matrix.arch }}
          path: dist-macos/
          if-no-files-found: error
          retention-days: 30

  # Optional native Windows MSI (WiX) in addition to the single-file PE.
  windows-msi:
    name: Package Windows (MSI)
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle (cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ env.GRADLE_CACHE_READ_ONLY }}
          cache-cleanup: on-success

      - name: Install WiX Toolset
        shell: powershell
        run: choco install wixtoolset -y --no-progress

      - name: Add WiX to PATH
        shell: bash
        run: |
          for d in \
            "/c/Program Files (x86)/WiX Toolset v3.14/bin" \
            "/c/Program Files (x86)/WiX Toolset v3.11/bin" \
            "/c/Program Files/WiX Toolset v3.14/bin" \
            "/c/Program Files/WiX Toolset v3.11/bin"
          do
            if [[ -d "$d" ]]; then
              echo "$d" >> "$GITHUB_PATH"
              echo "WiX bin: $d"
            fi
          done

      - name: Package MSI + fat jar
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon \
            :desktop:packageReleaseMsi \
            :desktop:fatJar \
            --stacktrace

      - name: Collect Windows MSI artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-windows-msi
          # Use find (not bash **): Compose writes main-release/msi/*.msi
          n=0
          while IFS= read -r f; do
            [[ -z "$f" ]] && continue
            echo "Found MSI: $f"
            cp -v "$f" dist-windows-msi/
            n=$((n + 1))
          done < <(find desktop/build/compose/binaries -type f -name '*.msi' 2>/dev/null | sort)
          if [[ "$n" -eq 0 ]]; then
            echo "ERROR: no MSI produced" >&2
            find desktop/build/compose/binaries -type f 2>/dev/null | head -100 || true
            exit 1
          fi
          if [[ -f desktop/build/libs/cache-fix-gui-kmp-all.jar ]]; then
            cp -v desktop/build/libs/cache-fix-gui-kmp-all.jar dist-windows-msi/
          fi
          ls -la dist-windows-msi

      - name: Upload Windows MSI
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: dist-windows-msi/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Attach release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, windows-msi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten for release
        run: |
          mkdir -p release
          find artifacts -type f \( \
            -name '*.exe' -o -name '*.dmg' -o -name '*.msi' -o -name '*.jar' \
            -o -name 'README.txt' -o -name 'README-*.txt' \
          \) -exec cp -v {} release/ \;
          ls -la release
          # Require at least one platform binary
          if ! find release -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.msi' \) | grep -q .; then
            echo "ERROR: no release binaries found under artifacts/" >&2
            find artifacts -type f | head -100 || true
            exit 1
          fi

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
