[package]
name = "cache-fix-gui"
version = "0.1.0"
description = "Tray + control panel for claude-code-cache-fix"
authors = ["BingZi-233"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "cache_fix_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
